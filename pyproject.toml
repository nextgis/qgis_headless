[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "qgis_headless"
description = "QGIS headless rendering library"
authors = [{ name = "NextGIS", email = "info@nextgis.com" }]
license = { text = "GPL" }
requires-python = ">=3.12"
dynamic = ["version"]

[project.scripts]
qgis_headless = "qgis_headless.script:main"

[project.optional-dependencies]
dev = ["pybind11-stubgen"]
tests = [
    "lxml",
    "pillow",
    "psutil",
    "pytest-benchmark",
    "pytest-datadir",
    "pytest-timeout",
    "pytest",
    "requests",
    "uwsgi",
]

[tool.setuptools]
packages = ["qgis_headless"]
zip-safe = false

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.ruff]
line-length = 99
exclude = ["./src/bindings/pybind11"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C4", "RUF022"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"./_qgis_headless.pyi" = ["RUF022"]
